name: pages
# The live site is built from source and published only after tests, evals and a real-browser
# check of every page pass. A broken or stale page cannot reach GitHub Pages.
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run evals
      - name: Build the site from source
        run: npm run build:web
      - name: Real-browser check of every page (3 screen sizes) and the main flows
        run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium && npm run site:check
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

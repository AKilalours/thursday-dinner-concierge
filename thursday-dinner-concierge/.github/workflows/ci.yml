name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      ANDE_PSQL: "-h localhost -p 5432 -U postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 || sudo apt-get install -y postgresql-client
      - run: npm install
      - run: npm run typecheck
      - name: Unit and contract tests (memory store and real Postgres)
        run: node --test --test-concurrency=1 test/*.test.ts
      - name: Eval suite (replays recorded model calls; invariants must be 100%)
        run: npm run evals
      - name: Randomized invariant fuzz
        run: npm run fuzz
      - uses: actions/upload-artifact@v4
        with: { name: eval-report, path: evals/results/ }
